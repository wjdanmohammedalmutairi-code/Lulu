<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبار تفاعلي</title>
<style>
:root{--bg:#fff8fb;--card:#fff;--pink:#e7b6cb;--pinksoft:#fff0f6;--line:#f0dbe5;--ink:#49313d;--muted:#876d79;--ok:#587b67;--bad:#a85f72}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:780px;margin:auto;padding:18px 12px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}
h2{margin:0 0 9px;text-align:center;font-size:22px}.small{font-size:13px;color:var(--muted);line-height:1.7}
.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.pick,button{border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.pick{background:#fff;border:2px solid var(--line);color:var(--ink)}.pick.active{background:var(--pinksoft);border-color:var(--pink);color:#85586c}.pick:disabled{opacity:.42;cursor:not-allowed}
.counts .pick:last-child{grid-column:1/-1}.primary{background:var(--pink);color:#fff}.secondary{background:var(--pinksoft);color:var(--ink)}.hidden{display:none!important}
.top{display:flex;justify-content:space-between;gap:10px}.progressTrack{height:9px;background:#f6e8ef;border-radius:999px;overflow:hidden;margin:10px 0 18px}.progress{height:100%;background:var(--pink);width:0;transition:.2s}
.question{font-size:20px;line-height:1.8;font-weight:700;text-align:right;margin:10px 0 16px}.options{display:grid;gap:10px}
.option{width:100%;text-align:right;background:#fff;border:2px solid var(--line);color:var(--ink);padding:14px;border-radius:15px;line-height:1.6}
.option.correct{background:#eef6f1;border-color:#8ab59a;color:#365d44}.option.wrong{background:#fff1f4;border-color:#d39aaa;color:#874556}
.feedback{margin-top:14px;padding:14px;border-radius:15px;line-height:1.8}.feedback.ok{background:#eef6f1;color:#365d44}.feedback.bad{background:#fff1f4;color:#874556}
.course{margin-top:9px;color:#755966;font-weight:600}.nav{display:flex;gap:10px;margin-top:16px}.nav button{flex:1}.result{text-align:center}.score{font-size:54px;color:#c77e9f;font-weight:900;margin:8px 0}.percent{font-size:22px;font-weight:800}
@media(max-width:520px){.wrap{padding:10px 9px 55px}.card{padding:14px;border-radius:18px}.question{font-size:18px}}
</style></head><body><div class="wrap">
<section id="setup" class="card"><h2>اختاري عدد الأسئلة</h2>
<div id="counts" class="counts">
<button class="pick active" data-count="20">20 سؤال</button><button class="pick" data-count="40">40 سؤال</button>
<button class="pick" data-count="60">60 سؤال</button><button class="pick" data-count="80">80 سؤال</button>
<button class="pick" data-count="100">100 سؤال</button><button class="pick" data-count="all">كل الأسئلة الموجودة</button>
</div><div id="selected" style="text-align:center;background:var(--pinksoft);padding:11px;border-radius:14px;font-weight:700;color:#85586c"></div>
<p id="available" class="small" style="text-align:center"></p><button id="start" class="primary" style="width:100%">ابدأ الاختبار</button></section>
<section id="quiz" class="card hidden"><div class="top"><div id="counter" class="small"></div><div id="liveScore" class="small"></div></div>
<div class="progressTrack"><div id="progress" class="progress"></div></div><div id="question" class="question"></div><div id="options" class="options"></div><div id="feedback"></div>
<div class="nav"><button id="finish" class="secondary">إنهاء</button><button id="next" class="primary" disabled>التالي</button></div></section>
<section id="result" class="card result hidden"><h2>النتيجة</h2><div id="score" class="score"></div><div id="percentage" class="percent"></div><button id="again" class="primary" style="margin-top:16px">اختبار جديد</button></section>
